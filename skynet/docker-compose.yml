services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: skynet-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Passwd01!
    platform: linux/amd64
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
volumes:
  sqlserver_data: